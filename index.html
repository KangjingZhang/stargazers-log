<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Open source, saved for later</p>
        <h1>Stargazers log</h1>
        <p class="intro">A running list of repositories worth coming back to.</p>
      </header>
      <section aria-labelledby="repositories-heading">
        <div class="list-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <span id="repository-count" class="count" aria-live="polite"></span>
        </div>
        <p id="repository-status" class="status" role="status">Loading repositories...</p>
        <ul id="repository-list" class="repository-list" aria-label="Starred repositories"></ul>
      </section>
      <script src="script.js" defer></script>
    </main>
  </body>
</html>
